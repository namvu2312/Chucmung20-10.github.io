<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A 12A3 Story: Gratitude Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            color: #00ffcc;
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            margin: 0;
        }

        #main-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Part 1 & 2: Terminal */
        .terminal {
            width: 90%;
            max-width: 800px;
            font-size: clamp(12px, 2vw, 16px);
            padding: 20px;
        }
        .line {
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 0.5em;
        }
        .line .prompt {
            color: #00ffcc;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1em;
            background-color: #00ffcc;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            vertical-align: text-bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .status-radiant { color: #ff79c6; text-shadow: 0 0 5px #ff79c6; }
        .status-bright { color: #f1fa8c; text-shadow: 0 0 5px #f1fa8c; }
        .status-inspiring { color: #ffb86c; text-shadow: 0 0 5px #ffb86c; }
        .status-precious { color: #8be9fd; text-shadow: 0 0 5px #8be9fd; }

        /* Part 3: Emotion Engine */
        #emotion-engine-screen {
            background-color: #0a0a1a;
        }
        .emotion-card {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1s, transform 1s;
        }
        .emotion-card.visible {
            opacity: 1;
            transform: scale(1);
        }
        .emotion-card .avatar {
            width: clamp(100px, 20vw, 150px);
            height: clamp(100px, 20vw, 150px);
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 0 15px white;
            margin-bottom: 20px;
        }
        .emotion-card .name {
            font-family: 'Major Mono Display', monospace;
            font-size: clamp(2rem, 8vw, 4rem);
            margin-bottom: 20px;
        }
        .emotion-card .message {
            font-size: clamp(1rem, 4vw, 1.5rem);
            max-width: 80%;
        }
        .particle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: float 20s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.7; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        /* Part 4 & 5: System Message & Finale */
        #finale-screen, #system-message-screen {
            background: #000;
            text-align: center;
        }
        .final-title {
            font-family: 'Major Mono Display', monospace;
            font-size: clamp(2rem, 8vw, 4rem);
            margin-bottom: 1em;
            text-shadow: 0 0 10px #cc99ff, 0 0 20px #cc99ff;
        }
        .heartbeat {
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        #startButton {
            padding: 20px 40px;
            font-size: 1.5rem;
            color: #0d021a;
            background-color: #00ffcc;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Roboto Mono', monospace;
            font-weight: bold;
            text-shadow: none;
            box-shadow: 0 0 15px #00ffcc, 0 0 25px #00ffcc;
            transition: all 0.3s;
        }
        #startButton:hover {
            transform: scale(1.05);
        }

    </style>
</head>
<body>
    <div id="main-container">
        <!-- Part 1 & 2 Screen -->
        <div id="terminal-screen" class="screen">
            <div id="terminal" class="terminal"></div>
        </div>

        <!-- Part 3 Screen -->
        <div id="emotion-engine-screen" class="screen">
            <div class="particle-container" id="particle-container"></div>
            <!-- Emotion cards will be injected here -->
        </div>
        
        <!-- Part 4 Screen -->
        <div id="system-message-screen" class="screen">
             <div id="system-message-terminal" class="terminal"></div>
        </div>

        <!-- Part 5 Screen -->
        <div id="finale-screen" class="screen">
             <div class="final-title">SYSTEM MESSAGE:</div>
             <div class="text-2xl md:text-4xl lg:text-5xl">
                12A3 <span class="heartbeat text-red-500">❤️</span> All The Girls.
             </div>
             <div class="mt-8 text-xl md:text-2xl text-pink-300">
                Happy Vietnamese Women's Day 20/10 🌸
             </div>
        </div>
        
        <div id="shutdown-screen" class="screen">
            <div id="shutdown-terminal" class="terminal"></div>
        </div>

        <button id="startButton">▶ Bắt đầu hành trình 12A3</button>
    </div>

    <!-- Audio Tracks -->
    <audio id="music1" loop src="https://cdn.pixabay.com/audio/2022/10/25/audio_583232115a.mp3"></audio> <!-- Soft ambient -->
    <audio id="music2" loop src="https://cdn.pixabay.com/audio/2022/05/27/audio_343206d02c.mp3"></audio> <!-- Upbeat drive -->
    <audio id="music3" loop src="https://cdn.pixabay.com/audio/2022/08/02/audio_85202873c2.mp3"></audio> <!-- Emotional Piano -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <script>
        // DOM Elements
        const startButton = document.getElementById('startButton');
        const screens = document.querySelectorAll('.screen');
        const terminalScreen = document.getElementById('terminal-screen');
        const emotionEngineScreen = document.getElementById('emotion-engine-screen');
        const systemMessageScreen = document.getElementById('system-message-screen');
        const finaleScreen = document.getElementById('finale-screen');
        const shutdownScreen = document.getElementById('shutdown-screen');
        const terminal = document.getElementById('terminal');
        const systemMessageTerminal = document.getElementById('system-message-terminal');
        const shutdownTerminal = document.getElementById('shutdown-terminal');
        const particleContainer = document.getElementById('particle-container');

        // Audio
        const music = {
            soft: document.getElementById('music1'),
            upbeat: document.getElementById('music2'),
            emotional: document.getElementById('music3'),
        };
        let synth, noiseSynth;

        // --- CẬP NHẬT Ở ĐÂY ---
        // Dán link ảnh hoặc mã Base64 của từng bạn vào thuộc tính "image". 
        // Nếu không có ảnh, hãy để trống ("").
        const girlsData = [
            { name: "Yến Nhy", image: "", status: { text: "Radiant", class: "status-radiant", icon: "🌸" }, message: "You’re the reason this class feels alive." },
            { name: "Hồng Phúc", image: "", status: { text: "Bright", class: "status-bright", icon: "💫" }, message: "Your smile lights up the entire room." },
            { name: "Thảo", image: "", status: { text: "Inspiring", class: "status-inspiring", icon: "🌻" }, message: "You motivate us to be better every day." },
            { name: "Hồng Nhung", image: "", status: { text: "Precious", class: "status-precious", icon: "💖" }, message: "A true gem of our collective." },
            { name: "Trang", image: "", status: { text: "Radiant", class: "status-radiant", icon: "🌸" }, message: "Bringing grace and joy wherever you go." },
            { name: "Liễu", image: "", status: { text: "Bright", class: "status-bright", icon: "💫" }, message: "Your intelligence and kindness shine bright." },
            { name: "Phương", image: "", status: { text: "Inspiring", class: "status-inspiring", icon: "🌻" }, message: "A source of strength and inspiration for all." },
            { name: "Xuân Mai", image: "", status: { text: "Precious", class: "status-precious", icon: "💖" }, message: "Your laughter is the sweetest melody." },
            { name: "Thu Trà", image: "", status: { text: "Radiant", class: "status-radiant", icon: "🌸" }, message: "Elegance and warmth in one wonderful person." },
            { name: "Ngọc Anh", image: "", status: { text: "Bright", class: "status-bright", icon: "💫" }, message: "A brilliant mind with a heart of gold." },
            { name: "Thu Hòa", image: "", status: { text: "Inspiring", class: "status-inspiring", icon: "🌻" }, message: "Your determination is truly admirable." },
            { name: "Ánh Thư", image: "", status: { text: "Precious", class: "status-precious", icon: "💖" }, message: "A cherished friend to everyone in 12A3." },
        ];
        
        const typingSpeed = 10; // Tăng tốc độ gõ chữ (số càng nhỏ càng nhanh)

        // --- CORE FUNCTIONS ---
        const sleep = ms => new Promise(res => setTimeout(res, ms));

        function setupAudio() {
            if (Tone.context.state !== 'running') Tone.start();
            synth = new Tone.Synth().toDestination();
            noiseSynth = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.05, release: 0.1 } }).toDestination();
            Object.values(music).forEach(track => track.volume = 0);
        }

        function switchScreen(activeScreen) {
            screens.forEach(s => s.classList.remove('active'));
            if (activeScreen) activeScreen.classList.add('active');
        }

        async function fadeMusic(track, targetVolume, duration = 1500) {
            const startVolume = track.volume;
            const steps = 50;
            const stepDuration = duration / steps;
            const volumeStep = (targetVolume - startVolume) / steps;
            
            for (let i = 0; i < steps; i++) {
                track.volume = Math.max(0, Math.min(1, startVolume + volumeStep * i));
                await sleep(stepDuration);
            }
            track.volume = targetVolume;
            if (targetVolume === 0) track.pause();
        }

        async function playMusic(track, targetVolume = 0.5, duration = 1500) {
            track.currentTime = 0;
            track.volume = 0;
            await track.play().catch(e => console.error("Audio play failed:", e));
            await fadeMusic(track, targetVolume, duration);
        }

        async function typeLine(text, element, speed = typingSpeed) {
            const line = document.createElement('div');
            line.className = 'line';
            element.appendChild(line);
            const prompt = '<span class="prompt">> </span>';
            line.innerHTML = prompt;

            for (let i = 0; i < text.length; i++) {
                line.innerHTML += text[i];
                if (text[i] !== ' ') {
                    try {
                        noiseSynth.triggerAttackRelease("8n");
                    } catch (e) {
                        // Ignore Tone.js errors on rapid calls
                    }
                }
                await sleep(speed);
            }
        }
        
        // --- SCRIPT SEQUENCE ---
        
        async function runPart1() {
            switchScreen(terminalScreen);
            playMusic(music.soft, 0.4);
            synth.triggerAttackRelease("C3", "8n");
            await typeLine("boot 12A3_system.exe", terminal);
            await sleep(100);
            await typeLine("Checking system integrity...", terminal);
            await sleep(100);
            await typeLine("Loading dependencies: [core.lib, render.dll, audio.mod]", terminal);
            await sleep(100);
            await typeLine("Establishing secure connection to 12A3_mainframe...", terminal);
            await sleep(100);
            await typeLine("loading emotions.dll", terminal);
            await sleep(100);
            await typeLine("connecting to hearts... <span class='text-green-400'>OK</span>", terminal);
            await sleep(100);
            synth.triggerAttackRelease("E3", "8n", Tone.now() + 0.1);
            await typeLine("initiating gratitude protocol...", terminal);
            await sleep(1000);
        }

        async function runPart2() {
            terminal.innerHTML = '';
            fadeMusic(music.soft, 0);
            playMusic(music.upbeat, 0.5);
            await typeLine("Accessing student records...", terminal, 15);
            await sleep(200);
            await typeLine("Decrypting database: girls_division.db...", terminal, 15);
            await sleep(200);

            const loadingBarLine = document.createElement('div');
            loadingBarLine.className = 'line';
            terminal.appendChild(loadingBarLine);
            const prompt = '<span class="prompt">> </span>';
            loadingBarLine.innerHTML = `${prompt}Scanning: [--------------------] 0%`;
            for (let i = 0; i <= 20; i++) {
                const progress = '#'.repeat(i) + '-'.repeat(20 - i);
                loadingBarLine.innerHTML = `${prompt}Scanning: [${progress}] ${i * 5}%`;
                if (i > 0) {
                     try { noiseSynth.triggerAttackRelease("8n"); } catch(e){}
                }
                await sleep(20);
            }
            
            await typeLine("Scan complete. 12 targets found.", terminal, 15);
            await sleep(500);

            for (const girl of girlsData) {
                const line = `Detected: ${girl.name} — Status: <span class="${girl.status.class}">${girl.status.text} ${girl.status.icon}</span>`;
                await typeLine(line, terminal, 10);
                await sleep(50);
            }
            await sleep(1500);
        }

        async function runPart3() {
            switchScreen(emotionEngineScreen);
            // Create particles
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 1;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}%`;
                p.style.animationDelay = `${Math.random() * 20}s`;
                particleContainer.appendChild(p);
            }
            
            const pastelColors = ['#282a36', '#44475a', '#3d2f4c', '#4c2f4a'];
            
            for (let i = 0; i < girlsData.length; i++) {
                const girl = girlsData[i];
                const card = document.createElement('div');
                card.className = 'emotion-card';
                card.style.color = girl.status.class.includes('bright') ? '#f1fa8c' : girl.status.class.includes('radiant') ? '#ff79c6' : '#8be9fd';
                emotionEngineScreen.style.background = pastelColors[i % pastelColors.length];
                
                let imageHTML = '';
                if (girl.image) {
                    imageHTML = `<img src="${girl.image}" alt="${girl.name}" class="avatar">`;
                }

                card.innerHTML = `
                    ${imageHTML}
                    <div class="name">${girl.name}</div>
                    <div class="message">"${girl.message} 🌷"</div>
                `;
                emotionEngineScreen.appendChild(card);
                
                await sleep(100);
                card.classList.add('visible');
                synth.triggerAttackRelease("C5", "8n");
                await sleep(3000); // Time each girl is on screen
                card.classList.remove('visible');
                await sleep(1000);
                emotionEngineScreen.removeChild(card);
            }
            particleContainer.innerHTML = '';
        }

        async function runPart4() {
            switchScreen(systemMessageScreen);
            fadeMusic(music.upbeat, 0);
            playMusic(music.emotional, 0.6);
            await typeLine("compiling gratitude.exe...", systemMessageTerminal);
            await sleep(150);
            await typeLine("Encrypting emotional packets with AES-256...", systemMessageTerminal);
            await sleep(150);
            await typeLine("Calculating optimal delivery route...", systemMessageTerminal);
            await sleep(150);
            await typeLine("Verifying recipient list...", systemMessageTerminal);
            await sleep(150);
            await typeLine("Dispatching packets... <span class='text-green-400'>[100%]</span>", systemMessageTerminal);
            await sleep(150);
            await typeLine("upload complete.", systemMessageTerminal);
            await sleep(1500);
        }

        async function runPart5() {
            switchScreen(finaleScreen);
            await sleep(5000);
        }

        async function runBonus() {
            switchScreen(shutdownScreen);
            fadeMusic(music.emotional, 0, 1000);
            await typeLine("saving memory...", shutdownTerminal);
            await sleep(200);
            await typeLine("happiness.log updated successfully", shutdownTerminal);
            await sleep(200);
            await typeLine("Clearing temporary files...", shutdownTerminal);
            await sleep(200);
            await typeLine("Disconnecting from mainframe...", shutdownTerminal);
            await sleep(500);
            await typeLine("shutting down system.", shutdownTerminal);
            synth.triggerAttackRelease("C2", "4n");
            await sleep(1000);
            document.body.style.transition = 'opacity 1s';
            document.body.style.opacity = 0;
        }

        // --- MAIN SEQUENCE ---
        async function runSequence() {
            await runPart1();
            await runPart2();
            await runPart3();
            await runPart4();
            await runPart5();
            await runBonus();
        }

        startButton.addEventListener('click', () => {
            startButton.style.display = 'none';
            setupAudio();
            runSequence();
        }, { once: true });

    </script>
</body>
</html>
